  __SHARED_STYLES__

  <link rel="preload" href="/assets/fonts/sofacet-score-josefin-regular.woff2" as="font" type="font/woff2" crossorigin>

<body data-phase="welcome" data-awaiting-explore>

      <div id="scene-frame" aria-hidden="true"></div>

    __SHARED_COPY__
    __SHARED_BRAND__

    <div id="scene-loading-status"><span data-scene-status role="status">Growing the diamonds…</span><progress data-scene-progress max="100" aria-label="World download"></progress></div>

      <progress data-scene-progress max="100" aria-label="World download"></progress>
